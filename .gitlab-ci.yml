stages:
  - sync
  - release
  - pages

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client

github-sync:
  stage: sync
  tags: [linux-truenas]
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache bash git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - git remote add github git@github.com:justacalico/oasis.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LOCAL_SHA=$(git rev-parse "$CI_COMMIT_TAG")
        REMOTE_SHA=$(git ls-remote --tags github "refs/tags/$CI_COMMIT_TAG" | awk '{print $1}' | head -n1)
        SINCE=""
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          echo "Tag $CI_COMMIT_TAG already mirrored to GitHub at $REMOTE_SHA, skipping"
        else
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git push -f github "$CI_COMMIT_TAG"
        fi
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
          SHA=$(git rev-parse "$CI_COMMIT_TAG^{commit}")
          RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push ${SINCE:+--since "$SINCE"} || true)
          if [ -z "$RUN_ID" ]; then
            echo "No GitHub run found for tag $CI_COMMIT_TAG" >&2
            exit 1
          fi
          bash scripts/watch-github-run.sh "$RUN_ID"
        fi
      else
        SHA=$(git rev-parse HEAD)
        REMOTE_MAIN=$(git ls-remote github refs/heads/main | awk '{print $1}')
        SINCE=""
        if [ "$REMOTE_MAIN" != "$SHA" ]; then
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        fi
        git push github HEAD:main
        RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push --branch main ${SINCE:+--since "$SINCE"} || true)
        if [ -z "$RUN_ID" ]; then
          echo "No GitHub run found for pushed commit $SHA" >&2
          exit 1
        fi
        bash scripts/watch-github-run.sh "$RUN_ID"
      fi

github-dispatch:
  stage: sync
  tags: [linux-truenas]
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh main "${BUILD_ALL:-true}" "${CREATE_RELEASE:-false}"

github-mr-build:
  stage: sync
  tags: [linux-truenas]
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false "$CI_COMMIT_SHA"

auto-release:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: auto-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [github-sync]
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/auto-release.sh

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - bash scripts/install-glab.sh
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
  script:
    - bash scripts/sync-from-github.sh

pages:
  stage: pages
  tags: [linux-truenas]
  image: debian:bookworm
  timeout: 45m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  needs: []
  variables:
    FLUTTER_VERSION: "3.47.7"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl git xz-utils unzip flatpak flatpak-builder gnupg ca-certificates file
    - curl -fsSL --retry 3 -o /tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz" || true
    - command -v glab >/dev/null || { tar -xzf /tmp/glab.tar.gz -C /tmp 2>/dev/null; install -m 755 /tmp/glab /usr/local/bin/glab 2>/dev/null || true; }
    - bash scripts/install-glab.sh || true
    - curl -fsSL --retry 3 -o /tmp/flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
    - mkdir -p /opt/flutter && tar -xJf /tmp/flutter.tar.xz -C /opt/flutter --strip-components=1
    - export PATH="/opt/flutter/bin:$PATH"
    - git config --global --add safe.directory /opt/flutter
    - flutter config --no-analytics >/dev/null
    - flutter precache --web --linux
  script:
    - export PATH="/opt/flutter/bin:$PATH"
    - mkdir -p public
    # Landing page at /
    - cd landing && flutter pub get && flutter build web --release --base-href "/$CI_PROJECT_NAME/" && cd ..
    - cp -r landing/build/web/* public/
    # App at /app/
    - flutter pub get && flutter build web --release --base-href "/$CI_PROJECT_NAME/app/"
    - mkdir -p public/app && cp -r build/web/* public/app/
    # Flatpak repo from the latest release, when it ships flatpak assets.
    - |
      mkdir -p public/flatpak
      ASSETS=$(glab api "projects/$CI_PROJECT_ID/releases?per_page=1" 2>/dev/null || echo '[]')
      TAG=$(printf '%s' "$ASSETS" | jq -r '.[0].tag_name // empty' 2>/dev/null || true)
      MERGED=0
      if [ -n "$TAG" ]; then
        mkdir -p /tmp/fpk
        for arch in x86_64 aarch64; do
          url="https://gitlab.com/$CI_PROJECT_PATH/-/releases/$TAG/downloads/oasis-flatpak-$arch.tar.gz"
          if curl -fsSL -o "/tmp/fpk/$arch.tar.gz" "$url"; then
            tar -xzf "/tmp/fpk/$arch.tar.gz" -C public/flatpak && MERGED=1
          fi
        done
      fi
      if [ "$MERGED" = "1" ] && [ -n "${FLATPAK_GPG_KEY:-}" ]; then
        mkdir -p .gpg && chmod 700 .gpg
        echo "$FLATPAK_GPG_KEY" | base64 -d | gpg --batch --homedir .gpg --import
        KEYID=$(gpg --homedir .gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
        flatpak build-update-repo --gpg-sign="$KEYID" --gpg-homedir="$(pwd)/.gpg" public/flatpak
        cp packaging/flatpak/key.gpg public/flatpak/key.gpg
        B64=$(base64 -w0 packaging/flatpak/key.gpg)
        {
          echo "[Flatpak Ref]"
          echo "Name=gitlab.httpanimations.oasis"
          echo "Branch=stable"
          echo "Title=Oasis"
          echo "Url=https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/flatpak"
          echo "SuggestRemoteName=oasis"
          echo "GPGKey=$B64"
          echo "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo"
        } > public/oasis.flatpakref
      else
        echo "No flatpak release assets yet or key missing; skipping flatpak repo"
      fi
    - ls -la public/
  artifacts:
    paths:
      - public
  environment:
    name: gitlab-pages
    url: https://HttpAnimations.gitlab.io/oasis/
