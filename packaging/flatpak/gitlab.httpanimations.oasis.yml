app-id: gitlab.httpanimations.oasis
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: oasis
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-data/applications:ro
modules:
  - name: oasis
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/oasis
      - cp -r bundle/* /app/lib/oasis/
      - ln -sf /app/lib/oasis/oasis /app/bin/oasis
      - install -Dm644 gitlab.httpanimations.oasis.desktop /app/share/applications/gitlab.httpanimations.oasis.desktop
      - install -Dm644 oasis.png /app/share/icons/hicolor/512x512/apps/gitlab.httpanimations.oasis.png
    sources:
      - type: dir
        path: bundle
      - type: file
        path: ../linux/gitlab.httpanimations.oasis.desktop
      - type: file
        path: ../linux/oasis.png
