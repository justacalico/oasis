name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all targets (linux x86_64 + aarch64)'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release from this build'
        type: boolean
        default: false
      merge_request_id:
        type: string
        default: ''
      merge_request_url:
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_date: ${{ steps.meta.outputs.build_date }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \(.*\)+.*/\1/p' pubspec.yaml | head -1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          BUILD_DATE=$(date +%Y-%m-%d)
          BUILD_ALL="${{ inputs.build_all || 'true' }}"
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"linux","os":"ubuntu-latest"},{"target":"linux-arm64","os":"ubuntu-24.04-arm"}]'
          else
            TARGETS='[{"target":"linux","os":"ubuntu-latest"}]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install cocogitto
        run: |
          curl -fsSL --retry 3 -o /tmp/cog.tar.gz https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz
          mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
          sudo install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
      - name: Check commits
        run: cog check
      - name: Analyze and test
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter analyze --no-pub
          flutter test --coverage
          python3 - <<'PY'
          lf = lh = 0
          for l in open('coverage/lcov.info'):
              if l.startswith('LF:'): lf += int(l[3:])
              if l.startswith('LH:'): lh += int(l[3:])
          print(f'coverage: {lh}/{lf}')
          assert lf > 0 and lh == lf, 'coverage below 100%'
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        if: matrix.target == 'linux'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter from source (arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          git clone --depth 1 --branch "${{ env.FLUTTER_VERSION }}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/bin/flutter" precache --linux

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev zip dpkg-dev rpm flatpak flatpak-builder gnupg curl

      - name: Build Linux bundle
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-linux-desktop
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            LINUX_ARCH=arm64; DEB_ARCH=arm64; RPM_ARCH=aarch64; OUT_ARCH=arm64
          else
            LINUX_ARCH=x64; DEB_ARCH=amd64; RPM_ARCH=x86_64; OUT_ARCH=x86_64
          fi
          echo "LINUX_ARCH=$LINUX_ARCH" >> "$GITHUB_ENV"
          echo "DEB_ARCH=$DEB_ARCH" >> "$GITHUB_ENV"
          echo "RPM_ARCH=$RPM_ARCH" >> "$GITHUB_ENV"
          echo "OUT_ARCH=$OUT_ARCH" >> "$GITHUB_ENV"
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Package tar.gz, zip, deb, rpm
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          BUNDLE="build/linux/$LINUX_ARCH/release/bundle"
          tar -czf "$ARTIFACTS_DIR/oasis-linux-$OUT_ARCH.tar.gz" -C "$BUNDLE" .
          (cd "$BUNDLE" && zip -qr "$ARTIFACTS_DIR/oasis-linux-$OUT_ARCH.zip" .)
          pkgdir="$GITHUB_WORKSPACE/oasis-linux-$OUT_ARCH-deb"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir/opt/oasis" "$pkgdir/usr/bin" "$pkgdir/DEBIAN"
          cp -r "$BUNDLE/." "$pkgdir/opt/oasis/"
          ln -sf /opt/oasis/oasis "$pkgdir/usr/bin/oasis"
          install -Dm644 packaging/linux/gitlab.httpanimations.oasis.desktop "$pkgdir/usr/share/applications/gitlab.httpanimations.oasis.desktop"
          install -Dm644 packaging/linux/oasis.png "$pkgdir/usr/share/icons/hicolor/512x512/apps/gitlab.httpanimations.oasis.png"
          install -Dm644 LICENSE "$pkgdir/usr/share/doc/oasis/copyright"
          {
            echo "Package: oasis"
            echo "Version: $VERSION"
            echo "Section: misc"
            echo "Priority: optional"
            echo "Architecture: $DEB_ARCH"
            echo "Maintainer: Oasis CI <ci@gitlab.com>"
            echo "Depends: libgtk-3-0t64 | libgtk-3-0, libepoxy0"
            echo "Description: Oasis desktop environment shell"
          } > "$pkgdir/DEBIAN/control"
          dpkg-deb --build "$pkgdir" "$ARTIFACTS_DIR/oasis-linux-$OUT_ARCH.deb" >/dev/null
          rm -rf "$pkgdir"
          ./scripts/build-rpm.sh "$BUNDLE" "$VERSION" "$RPM_ARCH" "$ARTIFACTS_DIR/oasis-linux-$OUT_ARCH.rpm" "$BUILD_NUMBER"

      - name: Build AppImage
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          BUNDLE="build/linux/$LINUX_ARCH/release/bundle"
          if [ "$OUT_ARCH" = "arm64" ]; then TOOL_ARCH=aarch64; else TOOL_ARCH=x86_64; fi
          curl -fsSL --retry 3 -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$TOOL_ARCH.AppImage"
          chmod +x /tmp/appimagetool
          APPDIR="$GITHUB_WORKSPACE/oasis.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE/." "$APPDIR/usr/bin/"
          cp packaging/linux/gitlab.httpanimations.oasis.desktop "$APPDIR/oasis.desktop"
          sed -i 's/^Icon=.*/Icon=oasis/' "$APPDIR/oasis.desktop"
          cp "$APPDIR/oasis.desktop" "$APPDIR/usr/share/applications/"
          cp packaging/linux/oasis.png "$APPDIR/oasis.png"
          cp packaging/linux/oasis.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/oasis.png"
          ln -sf usr/bin/oasis "$APPDIR/AppRun"
          (cd "$APPDIR" && ARCH=$TOOL_ARCH /tmp/appimagetool --appimage-extract-and-run . "$ARTIFACTS_DIR/oasis-linux-$OUT_ARCH.AppImage" || ARCH=$TOOL_ARCH /tmp/appimagetool "$APPDIR" "$ARTIFACTS_DIR/oasis-linux-$OUT_ARCH.AppImage")

      - name: Build signed Flatpak repo
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FLATPAK_GPG_KEY" ]; then
            echo "FLATPAK_GPG_KEY secret not set" >&2
            exit 1
          fi
          mkdir -p .gpg && chmod 700 .gpg
          echo "$FLATPAK_GPG_KEY" | base64 -d | gpg --batch --homedir .gpg --import
          KEYID=$(gpg --homedir .gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true
          BUNDLE="build/linux/$LINUX_ARCH/release/bundle"
          mkdir -p packaging/flatpak/bundle
          cp -r "$BUNDLE/." packaging/flatpak/bundle/
          REPO="$GITHUB_WORKSPACE/flatpak-repo-$OUT_ARCH"
          flatpak-builder --repo="$REPO" --gpg-sign="$KEYID" --gpg-homedir="$(pwd)/.gpg" --install-deps-from=flathub --force-clean flatpak-build packaging/flatpak/gitlab.httpanimations.oasis.yml
          tar -czf "artifacts/oasis-flatpak-$OUT_ARCH.tar.gz" -C "$REPO" .
          rm -rf flatpak-build packaging/flatpak/bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 400

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && inputs.merge_request_id == '' && ((github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v${{ needs.setup.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          TAG="${{ steps.meta.outputs.release_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$TAG")" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG exists on a different commit" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'oasis*' -exec cp {} release-assets/ \;
          TAG="${{ steps.meta.outputs.release_tag }}"
          git archive --format=tar.gz --prefix="oasis-${TAG#v}/" \
            -o "release-assets/oasis-${TAG}-source.tar.gz" "$TAG"
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Oasis ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          body: |
            **Version:** ${{ needs.setup.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ needs.setup.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            ### Artifacts
            - Linux desktop bundle (x86_64 + aarch64: tar.gz, zip, deb, rpm, AppImage)
            - Signed Flatpak repo archives (x86_64 + aarch64)
            - Source tarball

            ### Verification
            SHA256 checksums are in `SHA256SUMS.txt`.
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          for file in release-assets/* SHA256SUMS.txt; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "$file" --clobber; then
                uploaded=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Upload of $file failed (attempt $attempt), retrying in $((attempt * 15))s" >&2
                sleep $((attempt * 15))
              fi
            done
            if [ "$uploaded" != true ]; then
              echo "Failed to upload $file after 5 attempts" >&2
              exit 1
            fi
          done

  gitlab-sync:
    name: Trigger GitLab sync
    runs-on: ubuntu-latest
    needs: [release]
    if: always() && needs.release.result == 'success'
    steps:
      - name: Trigger GitLab sync pipeline
        run: |
          RELEASE_TAG="${{ needs.release.outputs.release_tag }}"
          curl -fsSL --max-time 30 --retry 2 -X POST \
            -H "PRIVATE-TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"variables\":[{\"key\":\"GITHUB_RUN_ID\",\"value\":\"${{ github.run_id }}\"},{\"key\":\"RELEASE_TAG\",\"value\":\"$RELEASE_TAG\"}]}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/pipeline"
